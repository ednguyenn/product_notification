AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Backend for Product Availability Notifications.

Globals:
  Function:
    Runtime: python3.9
    Timeout: 300
    Handler: app.lambda_handler
    Environment:
      Variables:
        ENV: dev

Resources:

  # Layers
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: CommonLayer
      Description: Common utilities for Lambda functions
      ContentUri: src/layers/common_layer/
      CompatibleRuntimes:
        - python3.9.
  OpenSearchLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: OpenSearchLayer
      Content: src/layers/opensearch_layer.zip
      CompatibleRuntimes:
        - python3.9

  # UserRequestHandlerFunction
  UserRequestHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/user_request_handler/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          USER_REQUESTS_TABLE: !Ref UserRequestsTable
      Events:
        SubmitRequest:
          Type: Api
          Properties:
            Path: /submitanewrequest
            Method: post
        ListRequests:
          Type: Api
          Properties:
            Path: /listrequests
            Method: get
        DeleteRequest:
          Type: Api
          Properties:
            Path: /deletearequest
            Method: delete
        UpdateRequest:
          Type: Api
          Properties:
            Path: /update
            Method: put
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserRequestsTable

  # ScraperFunction
  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: src/scraper_function/
      MemorySize: 2048
      Timeout: 600
      Environment:
        Variables:
          UNIQUE_POSTCODES_TABLE: !Ref UniquePostcodesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductCatalogTable
        - AWSLambdaBasicExecutionRole
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: src/scraper_function/
      DockerTag: python3.9-v1

  # IndexerFunction
  IndexerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/indexer_function/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref OpenSearchLayer
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !GetAtt OpenSearchDomain.DomainEndpoint
          AWS_REGION: !Ref AWS::Region
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - 'es:ESHttp*'
              Resource: !Sub 'arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/${OpenSearchDomain}/*'
      Events:
        DynamoDBStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ProductCatalogTable.StreamArn
            StartingPosition: LATEST

  # MatcherFunction
  MatcherFunction:
  Type: AWS::Serverless::Function
  Properties:
    CodeUri: src/matcher_function/
    Handler: app.lambda_handler
    Runtime: python3.9
    Layers:
      - !Ref OpenSearchLayer
    Environment:
      Variables:
        USER_REQUESTS_TABLE: !Ref UserRequestsTable
        OPENSEARCH_ENDPOINT: !GetAtt OpenSearchDomain.DomainEndpoint
        SNS_TOPIC_ARN: !Ref NotificationsTopic
    Policies:
      - DynamoDBStreamReadPolicy:
          TableName: !Ref UserRequestsTable
      - SNSPublishMessagePolicy:
          TopicName: !GetAtt NotificationsTopic.TopicName
      - Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'es:ESHttp*'
            Resource: !Sub 'arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/${OpenSearchDomain}/*'
    Events:
      DynamoDBStream:
        Type: DynamoDB
        Properties:
          Stream: !GetAtt UserRequestsTable.StreamArn
          BatchSize: 1
          StartingPosition: TRIM_HORIZON

  TriggerScraperFunction:
    Type: Custom::TriggerFunction
    Properties:
      ServiceToken: !GetAtt FunctionInvokeRole.Arn
      FunctionName: !Ref ScraperFunction
  
  # Lambda execution role to invoke the ScraperFunction
  FunctionInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeFunctionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt ScraperFunction.Arn

  WeeklyMatcherRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: "cron(0 6 ? * 5 *)"  # Runs every Thursday at 6:00 UTC
      Targets:
        - Arn: !GetAtt MatcherFunction.Arn
          Id: "WeeklyMatcherTrigger"
          Input: "{\"TriggerType\": \"weekly\"}"
      RoleArn: !GetAtt LambdaExecutionRole.Arn
  
  WeeklyScraperRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: "cron(0 1 ? * 5 *)" 
      Targets:
        - Arn: !GetAtt ScraperFunction.Arn
          Id: "WeeklyScraperTrigger"
          Input: "{\"TriggerType\": \"weekly\"}"  
      RoleArn: !GetAtt LambdaExecutionRole.Arn


  # DynamoDB Tables
  UserRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UserRequestsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: POSTCODE
          AttributeType: S
        - AttributeName: ProductName
          AttributeType: S
      KeySchema:
        - AttributeName: POSTCODE
          KeyType: HASH
        - AttributeName: ProductName
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  ProductCatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ProductCatalogTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: POSTCODE
          AttributeType: S
        - AttributeName: ProductName
          AttributeType: S
      KeySchema:
        - AttributeName: POSTCODE
          KeyType: HASH
        - AttributeName: ProductName
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  # OpenSearch Domain
  OpenSearchDomain:
    Type: AWS::Elasticsearch::Domain
    Properties:
      DomainName: 'product-catalog-domain'
      ElasticsearchVersion: '7.10'
      ElasticsearchClusterConfig:
        InstanceType: 't3.small.elasticsearch'
        InstanceCount: 1
      EBSOptions:
        EBSEnabled: true
        VolumeSize: 10
      AccessPolicies:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: '*'
            Action: 'es:*'
            Resource: '*'

  # SNS Topic
  NotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: UserNotifications

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  CommonLayerVersionArn:
    Description: "ARN of the Common Layer"
    Value: !Ref CommonLayer
  UserRequestHandlerFunctionArn:
    Description: "ARN of the UserRequestHandlerFunction"
    Value: !GetAtt UserRequestHandlerFunction.Arn
  UniquePostcodeUpdaterFunctionArn:
    Description: "ARN of the UniquePostcodeUpdaterFunction"
    Value: !GetAtt UniquePostcodeUpdaterFunction.Arn
  ScraperFunctionArn:
    Description: "ARN of the ScraperFunction"
    Value: !GetAtt ScraperFunction.Arn
  IndexerFunctionArn:
    Description: "ARN of the IndexerFunction"
    Value: !GetAtt IndexerFunction.Arn
  MatcherFunctionArn:
    Description: "ARN of the MatcherFunction"
    Value: !GetAtt MatcherFunction.Arn
  UserRequestsTableName:
    Description: "Name of the DynamoDB table for User Requests"
    Value: !Ref UserRequestsTable
  UniquePostcodesTableName:
    Description: "Name of the DynamoDB table for Unique Postcodes"
    Value: !Ref UniquePostcodesTable
  ProductCatalogTableName:
    Description: "Name of the DynamoDB table for Product Catalog"
    Value: !Ref ProductCatalogTable
  NotificationsTopicArn:
    Description: "ARN of the SNS Notifications Topic"
    Value: !Ref NotificationsTopic
  OpenSearchDomainEndpoint:
    Description: "Endpoint of the OpenSearch Domain"
    Value: !GetAtt OpenSearchDomain.DomainEndpoint
